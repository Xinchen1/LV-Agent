# Local CPU-friendly version

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "lv-agent"
version = "1.1.0"
description = "Terminal-native deep-thinking agent: recurrent reasoning, real tools, memory & self-learning"
authors = ["cleveris research"]
readme = "README.md"
license = "AGPL-3.0-only"
homepage = "https://github.com/Xinchen1/LV-Agent"
repository = "https://github.com/Xinchen1/LV-Agent"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
chromadb = "^0.4.22"
sentence-transformers = "^2.2.2"
numpy = "^1.24.0"
pyyaml = "^6.0"
tiktoken = "^0.5.0"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"
rich = "^13.7.0"
tqdm = "^4.66.0"
pytest = "^7.0"
black = "^23.0"
ruff = "^0.1.0"

# Optional dependencies
torch = { version = ">=2.1.0,<3.0", optional = true }
# 对外提供 MCP endpoint (agent_project.mcp_server) 才需要, Agent 本体不依赖
mcp = { version = ">=2.0", optional = true }

[tool.poetry.extras]
ml = ["chromadb", "sentence-transformers"]
mcp = ["mcp"]
all = ["torch", "chromadb", "sentence-transformers", "mcp"]
