[package]
name = "rust_file_ops"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
regex = "1"
rayon = "1.10"
shellexpand = "3"
encoding_rs = "0.8"
dirs = "5"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

[[bin]]
name = "rust_mcp_bridge"
path = "src/bin/mcp_daemon.rs"
