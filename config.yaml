# ============================================================
# 安全提示: 此文件将被 git 追踪。切勿将真实 API key / token
# 写入本文件。请在 .env 中设置环境变量，使用 ${VAR} 占位：
#   NIM_API_KEY / DEEPSEEK_API_KEY / OPENAI_API_KEY ...
# ============================================================

backend: openmythos
openai:
  api_key: null
  base_url: http://localhost:11434/v1
  model: qwen2.5:0.5b
  temperature: 0.7
  top_p: 0.9
  max_tokens: 4096
  timeout: 120
openrouter:
  api_key: null
  base_url: https://openrouter.ai/api/v1
  model: anthropic/claude-sonnet-4
  temperature: 0.7
  top_p: 0.9
  max_tokens: 4096
  timeout: 120
anthropic:
  api_key: null
  base_url: https://api.anthropic.com/v1
  model: claude-sonnet-4-20250514
  temperature: 0.7
  max_tokens: 4096
  timeout: 120
openmythos:
  model_path: null
  device: cpu
  dim: 256
  n_heads: 8
  n_kv_heads: 2
  max_seq_len: 4096
  max_loops: 8
  prelude_layers: 2
  coda_layers: 2
  attn_type: gqa
  n_experts: 8
  n_shared_experts: 1
  n_experts_per_tok: 2
  expert_dim: 64
  lora_rank: 8
  act_threshold: 0.95
  rope_theta: 500000.0
  dropout: 0.0
model:
  use_local: true
  model_path: null
  attention_type: mla
  dim: 256
  n_heads: 8
  max_loop_iters: 16
  n_experts: 8
  n_shared_experts: 1
  n_experts_per_tok: 2
  expert_dim: 64
  vocab_size: 32000
max_outer_loops: 1
default_thinking_loops: 2
max_thinking_loops: 16
temperature: 0.7
top_k: 50
act_threshold: 0.7
fast_mode: true
reflection:
  enabled: true
  frequency: 5
  min_failures_threshold: 3
  thinking_loops_for_reflection: 16
  save_reflections: true
  reflections_path: ./data/reflections
self_improvement:
  enabled: true
  auto_training: false
  training:
    sft_epochs: 1
    learning_rate: 1.0e-05
    batch_size: 2
    gradient_accumulation_steps: 4
tools:
  enabled: []
  web_search:
    enabled: false
    provider: duckduckgo
    max_results: 5
  file_ops:
    enabled: false
    allowed_dirs:
    - ./data
    - ./workspace
    max_file_size: 1048576
  code_exec:
    enabled: false
    timeout: 10
  api_call:
    enabled: false
    allowed_hosts: []
    timeout: 30
  bash_exec:
    enabled: true
    timeout: 120
    max_timeout: 600
    default_cwd: ''
  search_files:
    enabled: true
  glob:
    enabled: true
  browser:
    enabled: false
  git:
    enabled: false
  database:
    enabled: false
  telegram:
    enabled: true
    bot_token: test-token-12345
    allowed_user_ids: []
    polling: true
    webhook_url: ''
    config_path: ./data/telegram
experience:
  storage_type: memory
  vector_db_path: ./data/experience_store
  max_episodes: 10000
  auto_save: true
  save_interval: 10
strategies:
  enabled: true
  db_path: ./data/strategies
  min_success_rate: 0.7
  max_strategies_per_type: 50
logging:
  level: INFO
  file: ./logs/agent.log
  console: true
  rich_markup: true
planning:
  enabled: true
  default_strategy: adaptive
  optimize_plans: true
  max_subtasks: 10
  mcts_iterations: 100
  mcts_max_depth: 20
  mcts_exploration: 1.41
reasoning:
  enabled: true
  default_strategy: react
  multi_strategy_voting: false
  strategies_to_try:
  - react
  - chain_of_thought
  loop_controller_min_loops: 2
  loop_controller_max_loops: 16
  loop_controller_default_loops: 2
memory:
  enabled: true
  kg_storage_path: ./data/kg_store
  episodic_storage_path: ./data/episodic_store
  max_episodes: 10000
  auto_extract_entities: true
  context_compression: true
  compression_max_tokens: 512
self_correction:
  enabled: true
  low_confidence_threshold: 0.6
  high_error_threshold: 0.3
  inefficiency_threshold: 0.4
  intervention_window: 10
  auto_retraining_threshold: 0.6
mcp:
  enabled: false
  servers: {}
agent:
  backend: openai
  openai:
    api_key: ${NIM_API_KEY}
    base_url: https://integrate.api.nvidia.com/v1
    model: nvidia/nemotron-3-super-120b-a12b
    temperature: 1.0
    top_p: 0.95
    max_tokens: 16384
    timeout: 120
  deepseek:
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    temperature: 1.0
    top_p: 0.9
    max_tokens: 4096
    timeout: 120
